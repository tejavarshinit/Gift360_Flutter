name: gift360
description: "Gift360 - Gift Voucher Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Network
  dio: ^5.7.0
  connectivity_plus: ^6.1.3
  flutter_dotenv: ^5.2.1

  # Local Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.4

  # Models / Serialization
  json_annotation: ^4.9.0

  # UI
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.16
  toastification: ^3.0.2
  flutter_animate: ^4.5.2
  gap: ^3.0.1
  google_fonts: ^6.2.1

  # Forms
  # (using built-in Flutter form widgets)

  # Date
  intl: ^0.20.2

  # Encryption
  crypto: ^3.0.6
  encrypt: ^5.0.3

  # Location
  geolocator: ^14.0.0
  geocoding: ^4.0.0

  # Media picker (photo/video attach for the gifting flow)
  image_picker: ^1.1.2

  # URL
  url_launcher: ^6.3.1

  # WebView (for payment gateway)
  webview_flutter: ^4.10.0

  # SVG
  # flutter_svg already included above

  # Charts (for supercoin / analytics if needed)
  fl_chart: ^0.70.2

  # Pull to refresh
  pull_to_refresh_flutter3: ^2.0.2

  # Animations
  confetti: ^0.7.0

  # Time formatting
  timeago: ^3.7.0

  # App size / utils
  path_provider: ^2.1.5
  package_info_plus: ^8.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/pp-brands/
    - assets/icons/
    - .env
