name: gift360
description: "Gift360 - Gift Voucher Platform"
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Network
  dio: ^5.7.0
  flutter_dotenv: ^5.2.1

  # Local Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.4

  # UI
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  google_fonts: ^6.2.1

  # Date
  intl: ^0.20.2

  # Encryption
  crypto: ^3.0.6
  encrypt: ^5.0.3

  # Location
  geolocator: ^14.0.0

  # Media picker (photo/video attach for the gifting flow)
  image_picker: ^1.1.2

  # URL
  url_launcher: ^6.3.1

  # WebView (for payment gateway)
  webview_flutter: ^4.10.0

  # Time formatting
  timeago: ^3.7.0
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/pp-brands/
    - .env
